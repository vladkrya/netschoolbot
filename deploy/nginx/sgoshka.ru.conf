# Основной адрес мини-приложения: sgoshka.ru на vdsru, без Cloudflare
# (Cloudflare не открывается, когда мобильный интернет урезают до белых
# списков). Прежние ns/ns2/netschool.ikrya.ru работают параллельно: на них
# живут уже установленные PWA и пароли-ключи, привязанные к домену.
# Выпуск сертификата:
#   certbot certonly --webroot -w /var/www/html -d sgoshka.ru -d www.sgoshka.ru

server {
    listen 80;
    listen [::]:80;
    server_name sgoshka.ru www.sgoshka.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sgoshka.ru;

    ssl_certificate     /etc/letsencrypt/live/sgoshka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgoshka.ru/privkey.pem;

    return 301 https://sgoshka.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sgoshka.ru;

    ssl_certificate     /etc/letsencrypt/live/sgoshka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgoshka.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Ссылка на приложение персональная и содержит токен: она не должна
    # попадать в логи доступа.
    access_log off;

    client_max_body_size 16m;

    # Перезапуск при выкладке — страница «Обновляем приложение» вместо 502.
    include snippets/netschool-updating.conf;

    location / {
        proxy_pass http://127.0.0.1:8283;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $netschool_connection;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
