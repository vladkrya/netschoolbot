# Прежний домен мини-приложения «Сетевого города».
# Корень проксируется напрямую: редирект на /mini/netschool создаёт цикл,
# поскольку приложение возвращает старый путь обратно на /.
# Веб-терминала и файлового менеджера в проекте больше нет, поэтому и
# отдельных location для них тоже.

server {
    listen 80;
    listen [::]:80;
    server_name netschool.ikrya.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name netschool.ikrya.ru;

    ssl_certificate     /etc/letsencrypt/live/netschool.ikrya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netschool.ikrya.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Ссылка на приложение персональная и содержит токен: она не должна
    # попадать в логи доступа.
    access_log off;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8283;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Service worker обязан отдаваться без кэша, иначе обновление
    # приложения не доезжает до уже установленных копий.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8283/sw.js;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }
}
