# Резервный адрес мини-приложения на ВМ в Yandex Cloud (yavds.ikrya.ru).
# Когда мобильный интернет урезают до белых списков, Cloudflare и vdsru не
# открываются, а адреса Yandex Cloud — да. Сам бот остаётся на vdsru: сюда
# его порт 8283 пробрасывает deploy/systemd/miniapp-mirror@.service.
# DNS-запись не проксируется Cloudflare — иначе смысл резерва теряется.
# Выпуск сертификата: certbot certonly --webroot -w /var/www/html -d yavds.ikrya.ru
# «upgrade» — только запросам WebSocket (живые обновления); на ВМ yavds этот сайт один, поэтому map здесь.
map $http_upgrade $netschool_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name yavds.ikrya.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yavds.ikrya.ru;

    ssl_certificate     /etc/letsencrypt/live/yavds.ikrya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yavds.ikrya.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Ссылка на приложение персональная и содержит токен: она не должна
    # попадать в логи доступа.
    access_log off;

    client_max_body_size 16m;

    # Перезапуск при выкладке — страница «Обновляем приложение» вместо 502.
    include snippets/netschool-updating.conf;

    location / {
        proxy_pass http://127.0.0.1:8283;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $netschool_connection;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
