# Заголовок Connection для прокси мини-приложения: «upgrade» — только запросам
# WebSocket (живые обновления), остальным пустой — обычное соединение с бэкендом.
# Один на весь nginx (контекст http): подключается из conf.d, а сайты
# netschool/ns/ns2 ссылаются на переменную.
map $http_upgrade $netschool_connection {
    default upgrade;
    ''      '';
}
