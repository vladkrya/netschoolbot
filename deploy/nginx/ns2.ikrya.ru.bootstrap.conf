# Мини-приложение «Сетевого города» на коротком домене ns2.ikrya.ru.
# netschool.ikrya.ru работает параллельно: на нём живут уже установленные PWA.
# Выпуск сертификата: certbot certonly --webroot -w /var/www/certbot -d ns2.ikrya.ru

server {
    listen 80;
    listen [::]:80;
    server_name ns2.ikrya.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
