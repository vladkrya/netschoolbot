# Приложение не отвечает (перезапуск при выкладке, обрыв туннеля зеркала) —
# вместо голой «502 Bad Gateway» понятная страница «Обновляем приложение»,
# которая сама откроет дневник, когда сервер поднимется. Подключается в
# server{} сайтов мини-приложения: include snippets/netschool-updating.conf.
# Свои ответы 5xx приложения (JSON) проходят как есть: proxy_intercept_errors
# выключен, и error_page ловит только ошибки самого nginx.
error_page 502 503 504 =503 @netschool_updating;

location @netschool_updating {
    root /var/www/netschool-updating;
    try_files /index.html =503;
    # Метка для service worker и приложения: это не ответ приложения.
    add_header X-Netschool-Down "1" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "10" always;
}
