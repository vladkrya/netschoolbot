# Адрес приложения для мобильного интернета по белым спискам.
#
# Проверено 2026-10-07 на iPhone (4G, белые списки): *.apigw.yandexcloud.net,
# storage.yandexcloud.net и functions.yandexcloud.net открываются, а наша ВМ
# yavds (89.169.161.53, ns.ikrya.ru) и web.telegram.org — нет: фильтр по IP,
# и адреса ВМ Yandex Cloud в список не входят. API Gateway отвечает с адресов
# самого Яндекса и проксирует всё на ns.ikrya.ru; между облаком и ВМ белых
# списков нет.
#
# Создать: консоль Yandex Cloud → API Gateway → Создать → вставить этот файл.
# Полученный адрес https://<id>.apigw.yandexcloud.net прописать на сервере бота
# в .env как NETSCHOOL_MIRROR_URL — в /app_install и /app_reset появится
# кнопка «Резервный адрес».
openapi: 3.0.0
info:
  title: netschool-mirror
  version: 1.0.0
paths:
  /{path+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: path
          in: path
          required: false
          schema:
            type: string
      x-yc-apigateway-integration:
        type: http
        url: https://ns.ikrya.ru/{path}
        timeouts:
          connect: 5
          # Обновление дневника жестом ждёт школьный сервер до минуты.
          read: 75
