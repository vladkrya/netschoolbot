<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{ name or "Вложение" }}</title>
<style>
  :root { color-scheme: light dark; --bg: #eef1f6; --card: #fff; --text: #202733; --muted: #6b7486; --accent: #4a6fae; --bad: #c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111318; --card: #1b1e25; --text: #e8eaf0; --muted: #9aa2b2; --accent: #6f9be0; --bad: #ff7a6b; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
         background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  .card { width: min(100%, 380px); background: var(--card); border-radius: 18px; padding: 24px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 6px; word-break: break-word; }
  p { margin: 6px 0; color: var(--muted); }
  .spinner { width: 34px; height: 34px; margin: 4px auto 14px; border: 3px solid color-mix(in srgb, var(--accent) 20%, transparent);
             border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .btn { display: inline-block; margin-top: 14px; padding: 11px 18px; border-radius: 12px; border: 0; background: var(--accent); color: #fff;
         font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  .error { color: var(--bad); }
  .small { font-size: 14px; margin-top: 16px; }
  .small a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="spinner"></div>
  <h1>{{ name or "Вложение" }}</h1>
  <p id="state">Скачиваем файл из «Сетевого города»…</p>
  <p id="slow" hidden>Сервер школы отвечает медленно — подождите, загрузка не остановилась.</p>
  <a class="btn" id="open" hidden>Открыть файл</a>
  <button class="btn" id="retry" hidden type="button">Повторить</button>
  <p class="small"><a id="direct" hidden>Не получается? Открыть файл напрямую</a></p>
</div>
<script>
(function () {
  // Тот же адрес, только /api/attachment/ вместо /attachment/: билет и имя
  // файла уже в строке запроса.
  var file = location.pathname.replace(/\/attachment\/(\d+)\/?$/, '/api/attachment/$1') + location.search;
  var prepare = file + (location.search ? '&' : '?') + 'prepare=1';
  var $ = function (id) { return document.getElementById(id); };
  var slowTimer;
  // Файл не собираем в blob: сервер сперва кладёт его в кэш (prepare),
  // а потом браузер открывает обычную ссылку. Так pdf показывается
  // просмотром, имя файла берётся из заголовка сервера, и всё работает
  // во встроенных браузерах, где blob-ссылки не открываются.
  $('open').href = file;
  $('direct').href = file;

  function show(ids) {
    ['spinner', 'slow', 'open', 'retry', 'direct'].forEach(function (id) {
      $(id).hidden = ids.indexOf(id) < 0;
    });
  }

  function fail(message) {
    clearTimeout(slowTimer);
    show(['retry', 'direct']);
    $('state').textContent = message; $('state').className = 'error';
  }

  async function load() {
    show(['spinner']);
    $('state').className = ''; $('state').textContent = 'Скачиваем файл из «Сетевого города»…';
    slowTimer = setTimeout(function () { $('slow').hidden = false; }, 12000);
    var response;
    try {
      response = await fetch(prepare, { credentials: 'same-origin' });
    } catch (e) {
      return fail('Нет связи с сервером. Проверьте интернет и повторите.');
    }
    if (!response.ok) {
      // 502/504 без JSON — это nginx не дождался ответа, а не наша ошибка.
      var message = response.status === 502 || response.status === 504
        ? 'Сервер школы слишком долго отдаёт файл. Попробуйте ещё раз чуть позже.'
        : 'Не удалось скачать файл (ошибка ' + response.status + ').';
      try { message = (await response.json()).error || message; } catch (e) { /* не JSON */ }
      return fail(message);
    }
    clearTimeout(slowTimer);
    show(['open']);
    $('state').textContent = 'Файл готов. Если он не открылся сам — нажмите кнопку.';
    location.href = file;
  }

  $('retry').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
