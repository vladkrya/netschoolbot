<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#4a6fae">
<!-- iPhone, приложение с домашнего экрана: страница во весь экран, под
     строкой состояния, а не под голубой полосой цвета theme-color. Отступ
     сверху даёт safe-area-inset-top (см. --safe-top в app.css). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Системная область получает цвет шапки уже до первой отрисовки.
  try {
    var theme = localStorage.getItem('ns-theme');
    var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
    var accent = localStorage.getItem('ns-accent');
    if (!/^#[0-9a-f]{6}$/i.test(accent || '')) accent = '#4a6fae';
    var fresh = localStorage.getItem('ns-design') === 'new';
    if (fresh) document.documentElement.setAttribute('data-design', 'new');
    var bg = fresh ? (dark ? '#0f1217' : '#f3f4f8') : (dark ? '#141a22' : '#eef1f6');
    var glass = CSS.supports('background', 'color-mix(in srgb, red 50%, transparent)')
      && (CSS.supports('backdrop-filter', 'blur(1px)') || CSS.supports('-webkit-backdrop-filter', 'blur(1px)'));
    var chrome = '#' + [1, 3, 5].map(function(offset) {
      var foreground = parseInt(accent.slice(offset, offset + 2), 16);
      var background = parseInt(bg.slice(offset, offset + 2), 16);
      return Math.round(glass ? foreground * .8 + background * .2 : foreground).toString(16).padStart(2, '0');
    }).join('');
    // В новом дизайне шапка не цветная, а в тон фону.
    if (fresh) chrome = bg;
    document.documentElement.style.setProperty('--head', accent);
    document.documentElement.style.setProperty('--chrome-head', chrome);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', chrome);
  } catch (e) {}
</script>
<title>{{ school or "Дневник" }}</title>
{% if not demo %}<link rel="manifest" href="{{ base }}/manifest.webmanifest?token={{ token }}">{% endif %}
<link rel="icon" type="image/png" href="{{ base }}/static/icon-192.png">
<!-- PNG, а не SVG: iOS не берёт SVG для иконки на домашнем экране и
     оставляет пустую плитку. -->
<link rel="apple-touch-icon" href="{{ base }}/static/apple-touch-icon.png">
<link rel="stylesheet" href="{{ base }}/static/v{{ version }}/app.css">
<!-- «Новый дизайн» (тумблер в меню ☰): все правила под html[data-design="new"]. -->
<link rel="stylesheet" href="{{ base }}/static/v{{ version }}/new.css">
<!-- До app.js: приложению нужен Telegram.WebApp уже при старте, чтобы
     забрать initData до первого запроса. Копия у нас, а не с telegram.org:
     без VPN telegram.org заблокирован, и синхронный скрипт в head не давал
     странице отрисоваться — оставался пустой тёмный экран. -->
<script src="{{ base }}/static/v{{ version }}/telegram-web-app.js"></script>
</head>
<body>

<!-- Шапка и полоса вкладки — один закреплённый блок: раньше полоса с датой
     была липкой внутри страницы и при прокрутке отрывалась от шапки. -->
<header class="app-header" id="appHeader">
  <div class="topbar">
    <button class="topbar-btn" id="menuBtn" aria-label="Меню" data-icon="menu"></button>
    <div class="topbar-title" id="topTitle">Дневник</div>
    <button class="topbar-btn" id="bellBtn" aria-label="Объявления" data-icon="bell"></button>
  </div>

  <div class="subbar" data-for="day">
    <div class="date-bar">
      <button class="date-arrow" id="dayPrev" aria-label="Предыдущий день" data-icon="left"></button>
      <button class="date-title" id="dayTitle">
        <span class="date-label" id="dayLabel">Сегодня</span>
        <span class="date-sub" id="daySub"></span>
      </button>
      <button class="date-arrow" id="dayNext" aria-label="Следующий день" data-icon="right"></button>
    </div>
    <!-- Неделя полосой: только в новом дизайне (new.css). -->
    <div class="week-strip" id="weekStrip"></div>
  </div>

  <div class="subbar" data-for="schedule" hidden>
    <div class="date-bar">
      <button class="date-arrow" id="schedPrev" aria-label="Предыдущая неделя" data-icon="left"></button>
      <button class="date-title" id="schedTitle">
        <span class="date-label" id="schedLabel">Текущая</span>
        <span class="date-sub" id="schedSub"></span>
      </button>
      <button class="date-arrow" id="schedNext" aria-label="Следующая неделя" data-icon="right"></button>
    </div>
  </div>

  <div class="subbar" data-for="homework" hidden>
    <div class="filter-bar">
      <div class="segment-title" id="hwCount">Домашние задания</div>
      <label class="search"><span data-icon="search"></span>
        <input id="hwSearch" type="search" placeholder="Поиск" autocomplete="off"></label>
      <div class="chips hw-filters" id="hwFilters">
        <button class="chip active" data-filter="all">Все</button>
        <button class="chip" data-filter="todo">Не сделано</button>
        <button class="chip" data-filter="past">Прошедшие</button>
      </div>
    </div>
  </div>

  <div class="subbar" data-for="mail" hidden>
    <div class="filter-bar"><div class="segment-title">Входящие</div></div>
  </div>
</header>

<div class="pull-indicator" id="pullIndicator"></div>
<div class="banner" id="banner" hidden></div>

<main>
  <section class="panel active" id="panel-day"><div class="list" id="dayContent"></div></section>
  <section class="panel" id="panel-schedule"><div class="list" id="scheduleContent"></div></section>
  <section class="panel" id="panel-homework"><div class="list" id="homeworkContent"></div></section>
  <section class="panel" id="panel-totals"><div id="totalsContent"></div></section>
  <section class="panel" id="panel-mail">
    <div class="list" id="mailContent"></div>
    <button class="fab" id="composeBtn" aria-label="Написать письмо" data-icon="plus"></button>
  </section>
</main>

<div id="screens"></div>

<nav class="bottom-nav" id="bottomNav">
  <span class="nav-glider" aria-hidden="true"></span>
  <button class="nav-item active" data-tab="day"><span class="ico" data-icon="clock"></span><span>День</span></button>
  <button class="nav-item" data-tab="schedule"><span class="ico" data-icon="calendar"></span><span class="lbl-old">Расписание</span><span class="lbl-new">Неделя</span></button>
  <button class="nav-item" data-tab="homework"><span class="ico" data-icon="home"></span><span class="lbl-old">Д/З</span><span class="lbl-new">Задания</span></button>
  <button class="nav-item" data-tab="totals"><span class="ico" data-icon="book"></span><span class="lbl-old">Итоги</span><span class="lbl-new">Оценки</span></button>
  <button class="nav-item" data-tab="mail"><span class="ico" data-icon="megaphone"></span><span class="lbl-old">Сообщения</span><span class="lbl-new">Почта</span></button>
</nav>

<aside class="drawer" id="drawer">
  <div class="drawer-shade" id="drawerShade"></div>
  <div class="drawer-panel" id="drawerBody"></div>
</aside>

<div class="overlay" id="sheet" hidden>
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="sheetTitle"></h3>
      <button class="sheet-close" id="sheetClose" aria-label="Закрыть" data-icon="close"></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
  window.NETSCHOOL = {
    base: {{ base | tojson }},
    token: {{ token | tojson }},
    pushEnabled: {{ push_enabled | tojson }},
    student: {{ student | tojson }},
    school: {{ school | tojson }},
    demo: {{ (demo or false) | tojson }}
  };
</script>
<script>
  // Cloudflare иногда не достукивается до сервера (522), и обрыв любого
  // модуля ломал всё приложение. Пробуем перезагрузить страницу пару раз.
  function netschoolBootFailed() {
    var tries = 0;
    try { tries = Number(sessionStorage.getItem('bootRetries') || 0); } catch (e) {}
    if (tries < 2) {
      try { sessionStorage.setItem('bootRetries', String(tries + 1)); } catch (e) {}
      setTimeout(function () { location.reload(); }, 1500 * (tries + 1));
      return;
    }
    try { sessionStorage.removeItem('bootRetries'); } catch (e) {}
    var el = document.getElementById('banner');
    if (el) {
      el.textContent = 'Не удалось загрузить приложение. Закройте и откройте его снова.';
      el.classList.add('error');
      el.hidden = false;
    }
  }
</script>
<script src="{{ base }}/static/v{{ version }}/js/app.js" type="module" onerror="netschoolBootFailed()"></script>
</body>
</html>
