<!DOCTYPE html>
<html lang="ru" class="app-locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#4a6fae">
<!-- iPhone, приложение с домашнего экрана: страница во весь экран, под
     строкой состояния, а не под голубой полосой цвета theme-color. Отступ
     сверху даёт safe-area-inset-top (см. --safe-top в app.css). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Системная область получает цвет шапки уже до первой отрисовки.
  try {
    var theme = localStorage.getItem('ns-theme');
    var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
    var accent = localStorage.getItem('ns-accent');
    if (!/^#[0-9a-f]{6}$/i.test(accent || '')) accent = '#4a6fae';
    var fresh = localStorage.getItem('ns-design') === 'new';
    if (fresh) document.documentElement.setAttribute('data-design', 'new');
    var bg = fresh ? (dark ? '#0f1217' : '#f3f4f8') : (dark ? '#141a22' : '#eef1f6');
    var glass = CSS.supports('background', 'color-mix(in srgb, red 50%, transparent)')
      && (CSS.supports('backdrop-filter', 'blur(1px)') || CSS.supports('-webkit-backdrop-filter', 'blur(1px)'));
    var chrome = '#' + [1, 3, 5].map(function(offset) {
      var foreground = parseInt(accent.slice(offset, offset + 2), 16);
      var background = parseInt(bg.slice(offset, offset + 2), 16);
      return Math.round(glass ? foreground * .8 + background * .2 : foreground).toString(16).padStart(2, '0');
    }).join('');
    // В новом дизайне шапка не цветная, а в тон фону.
    if (fresh) chrome = bg;
    // Фон темы — сразу, до стилей: пока они грузятся, экран не чёрный.
    document.documentElement.style.background = bg;
    document.documentElement.style.setProperty('--boot-bg', bg);
    document.documentElement.style.setProperty('--head', accent);
    document.documentElement.style.setProperty('--chrome-head', chrome);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', chrome);
  } catch (e) {}
</script>
<style>
  html { background: #eef1f6; }
  html.app-locked body > :not(.app-lock) { visibility: hidden !important; }
  .boot-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; text-align: center; background: var(--boot-bg, #eef1f6); font: 15px -apple-system, BlinkMacSystemFont, sans-serif; color: #64748b; }
  .boot-spinner { display: block; width: 30px; height: 30px; margin: 0 auto 18px; border: 3px solid #94a3b833; border-top-color: #4a6fae; border-radius: 50%; animation: boot-spin .8s linear infinite; }
  @keyframes boot-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .boot-spinner { animation: none; } }
</style>
<title>{{ school or "Дневник" }}</title>
{% if not demo %}<link rel="manifest" href="{{ base }}/manifest.webmanifest?token={{ token }}">{% endif %}
<link rel="icon" type="image/png" href="{{ base }}/static/icon-192.png">
<!-- PNG, а не SVG: iOS не берёт SVG для иконки на домашнем экране и
     оставляет пустую плитку. -->
<link rel="apple-touch-icon" href="{{ base }}/static/apple-touch-icon.png">
<link rel="stylesheet" href="{{ base }}/static/v{{ version }}/app.css">
<!-- «Новый дизайн» (тумблер в меню ☰): все правила под html[data-design="new"]. -->
<link rel="stylesheet" href="{{ base }}/static/v{{ version }}/new.css">
<!-- Планшеты и компьютеры: колонка по центру, на компьютере вкладки слева. -->
<link rel="stylesheet" href="{{ base }}/static/v{{ version }}/wide.css">
<!-- До app.js: приложению нужен Telegram.WebApp уже при старте, чтобы
     забрать initData до первого запроса. Копия у нас, а не с telegram.org:
     без VPN telegram.org заблокирован, и синхронный скрипт в head не давал
     странице отрисоваться — оставался пустой тёмный экран. -->
<!-- defer: скрипт Telegram больше не держит первую отрисовку, а выполняется
     всё равно раньше app.js — отложенные скрипты идут по порядку. -->
<script src="{{ base }}/static/v{{ version }}/telegram-web-app.js" defer></script>
{% for module in boot_modules %}<link rel="modulepreload" href="{{ base }}/static/v{{ version }}/js/{{ module }}">
{% endfor %}
</head>
<body>
<div class="app-lock boot-splash" id="bootSplash" role="status" aria-live="polite">
  <div><span class="boot-spinner" aria-hidden="true"></span><p>Открываем дневник…</p></div>
</div>

<!-- Шапка и полоса вкладки — один закреплённый блок: раньше полоса с датой
     была липкой внутри страницы и при прокрутке отрывалась от шапки. -->
<header class="app-header" id="appHeader">
  <div class="topbar">
    <!-- Меню ☰ — только в классическом дизайне; в новом настройки живут во
         вкладке, а кнопка остаётся пустым местом, чтобы имя было по центру. -->
    <button class="topbar-btn" id="menuBtn" aria-label="Меню" data-icon="menu"></button>
    <!-- Имя ученика; у родителя с несколькими детьми — стрелка и выбор ребёнка. -->
    <button class="topbar-title" id="topTitle" type="button"><span id="topName">Дневник</span><span class="title-switch" id="titleSwitch" data-icon="down" hidden></span></button>
    <button class="topbar-btn" id="bellBtn" aria-label="Объявления" data-icon="bell"></button>
  </div>

  <div class="subbar" data-for="day">
    <div class="date-bar">
      <button class="date-arrow" id="dayPrev" aria-label="Предыдущий день" data-icon="left"></button>
      <button class="date-title" id="dayTitle">
        <span class="date-label" id="dayLabel">Сегодня</span>
        <span class="date-sub" id="daySub"></span>
      </button>
      <!-- Звонки и неделя шторкой: только в новом дизайне, где нет вкладки «Звонки». -->
      <button class="date-arrow day-bells" id="dayBells" aria-label="Звонки и неделя" data-icon="clock"></button>
      <button class="date-arrow" id="dayNext" aria-label="Следующий день" data-icon="right"></button>
    </div>
    <!-- Неделя полосой: только в новом дизайне (new.css). -->
    <div class="week-strip" id="weekStrip"></div>
  </div>

  <div class="subbar" data-for="schedule" hidden>
    <div class="date-bar">
      <button class="date-arrow" id="schedPrev" aria-label="Предыдущая неделя" data-icon="left"></button>
      <button class="date-title" id="schedTitle">
        <span class="date-label" id="schedLabel">Текущая</span>
        <span class="date-sub" id="schedSub"></span>
      </button>
      <button class="date-arrow" id="schedNext" aria-label="Следующая неделя" data-icon="right"></button>
    </div>
    <!-- Новый дизайн, режим звонков: вместо стрелок недель — пометка. -->
    <div class="bells-note" id="bellsNote" hidden>Звонки пока в разработке: время собрано из расписания уроков и может быть неточным.</div>
  </div>

  <div class="subbar" data-for="homework" hidden>
    <div class="filter-bar">
      <div class="segment-title" id="hwCount">Домашние задания</div>
      <label class="search"><span data-icon="search"></span>
        <input id="hwSearch" type="search" placeholder="Поиск" autocomplete="off"></label>
      <div class="chips hw-filters" id="hwFilters">
        <button class="chip active" data-filter="all">Все</button>
        <button class="chip" data-filter="todo">Не сделано</button>
        <button class="chip" data-filter="past">Прошедшие</button>
      </div>
    </div>
  </div>

  <div class="subbar" data-for="mail" hidden>
    <div class="filter-bar"><div class="segment-title">Входящие</div>
      <!-- Новый дизайн: объявления здесь же, а не под колокольчиком в шапке. -->
      <div class="seg-glass mail-seg" id="mailSeg" style="--n:2;--i:0">
        <span class="seg-lens" aria-hidden="true"></span>
        <button class="on" data-mail-mode="mail">Письма</button>
        <button data-mail-mode="ann">Объявления</button>
      </div>
      <!-- Поиск и фильтры писем; в разделе объявлений скрыты. -->
      <div class="mail-tools" id="mailTools">
        <div class="mail-search-row">
          <label class="search"><span data-icon="search"></span>
            <input id="mailSearch" type="search" placeholder="Тема или отправитель" autocomplete="off"></label>
          <button class="chip mail-sort" id="mailSort" aria-label="Порядок писем">↓ Новые</button>
        </div>
        <div class="chips mail-filters" id="mailFilters">
          <button class="chip active" data-filter="all">Все</button>
          <button class="chip" data-filter="unread">Непрочитанные</button>
          <button class="chip" data-filter="read">Прочитанные</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="pull-indicator" id="pullIndicator"></div>
<div class="banner" id="banner" hidden></div>

<main>
  <section class="panel active" id="panel-day">
    <div class="list" id="dayContent"></div>
    <!-- ИИ-помощник кнопкой (новый дизайн, если помощник включён на сервере). -->
    <button class="fab ai-fab" id="aiFab" aria-label="ИИ-помощник" data-icon="sparkles" hidden></button>
  </section>
  <section class="panel" id="panel-schedule"><div class="list" id="scheduleContent"></div></section>
  <section class="panel" id="panel-homework"><div class="list" id="homeworkContent"></div></section>
  <section class="panel" id="panel-totals"><div id="totalsContent"></div></section>
  <section class="panel" id="panel-mail">
    <div class="list" id="mailContent"></div>
    <button class="fab" id="composeBtn" aria-label="Написать письмо" data-icon="plus"></button>
  </section>
  <section class="panel" id="panel-assistant"><div id="assistantContent"></div></section>
  <section class="panel" id="panel-settings"><div class="settings-page" id="settingsContent"></div></section>
</main>

<div id="screens"></div>

<!-- Пункты собирает tabs.js: в новом дизайне набор и порядок настраиваются. -->
<nav class="bottom-nav" id="bottomNav">
  <span class="nav-glider" aria-hidden="true"></span>
  <!-- Меню ☰ в боковой панели: только на компьютере в классическом дизайне (wide.css). -->
  <button class="nav-menu" id="navMenuBtn" type="button"><span class="ico" data-icon="menu"></span><span>Меню</span></button>
</nav>

<aside class="drawer" id="drawer">
  <div class="drawer-shade" id="drawerShade"></div>
  <div class="drawer-panel" id="drawerBody"></div>
</aside>

<div class="overlay" id="sheet" hidden>
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="sheetTitle"></h3>
      <button class="sheet-close" id="sheetClose" aria-label="Закрыть" data-icon="close"></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
  window.NETSCHOOL = {
    modules: [{% for module in modules %}{{ (base ~ '/static/v' ~ version ~ '/js/' ~ module) | tojson }}{{ ',' if not loop.last else '' }}{% endfor %}],
    base: {{ base | tojson }},
    token: {{ token | tojson }},
    pushEnabled: {{ push_enabled | tojson }},
    assistant: {{ (assistant and not demo) | tojson }},
    student: {{ student | tojson }},
    school: {{ school | tojson }},
    demo: {{ (demo or false) | tojson }}
  };
</script>
<script>
  // Cloudflare иногда не достукивается до сервера (522), и обрыв любого
  // модуля ломал всё приложение. Пробуем перезагрузить страницу пару раз.
  function netschoolBootFailed() {
    var tries = 0;
    try { tries = Number(sessionStorage.getItem('bootRetries') || 0); } catch (e) {}
    if (tries < 2) {
      try { sessionStorage.setItem('bootRetries', String(tries + 1)); } catch (e) {}
      setTimeout(function () { location.reload(); }, 1500 * (tries + 1));
      return;
    }
    try { sessionStorage.removeItem('bootRetries'); } catch (e) {}
    var el = document.getElementById('bootSplash');
    if (el) {
      el.innerHTML = '<div><p>Не удалось загрузить приложение.</p><button type="button" onclick="location.reload()">Повторить</button></div>';
      return;
    }
    var el = document.getElementById('banner');
    if (el) {
      el.textContent = 'Не удалось загрузить приложение. Закройте и откройте его снова.';
      el.classList.add('error');
      el.hidden = false;
    }
  }
</script>
<script src="{{ base }}/static/v{{ version }}/js/boot.js" type="module" onerror="netschoolBootFailed()"></script>
</body>
</html>
